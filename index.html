<script>
/* ① 部署路径自适应：算出 basename，供路由与本地图片使用 */
(function () {
  var p = location.pathname.replace(/\/index\.html?$/i, '');
  if (p.length > 1 && p.slice(-1) === '/') p = p.slice(0, -1);
  window.__BASENAME__ = p || '/';
  window.__ASSET__ = function (name) {
    var b = window.__BASENAME__;
    return (b === '/' ? '' : b) + '/assets/img/' + name;
  };
  window.appId = 'app_17ghwftdtz3';
  window.ENVIRONMENT = 'online';
  window.userId = ''; window.userName = ''; window.csrfToken = ''; window.tenantId = '';
})();
</script>
<script>
/* ② 移除豆包/妙搭水印（运行时注入，持续清理） */
(function () {
  var kill = function () { document.querySelectorAll('miaoda-watermark').forEach(function (e) { e.remove(); }); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', kill); else kill();
  new MutationObserver(kill).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<script>
/* ③ 屏蔽妙搭平台遥测接口（游戏逻辑不依赖它们，仅避免控制台 404） */
(function () {
  var orig = window.fetch;
  window.fetch = function (input, init) {
    var u = (typeof input === 'string') ? input : (input && input.url) || '';
    if (u.indexOf('__runtime__') !== -1 || u.indexOf('/runtime/api/') !== -1 || u.indexOf('/observability/') !== -1) {
      return Promise.resolve(new Response('{"code":0,"data":{"timestampNs":"0"}}',
        { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    return orig.apply(this, arguments);
  };
})();
</script>
